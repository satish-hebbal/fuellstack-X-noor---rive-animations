<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>NOOR Animation Assets</title>
    <meta name="description" content="Rive animation assets for NOOR." />

    <!-- Fredoka, from Google Fonts. The two preconnects matter: they open the
         DNS + TLS connections to both Google hosts in parallel with parsing,
         instead of the stylesheet request having to wait for them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Both axes are requested as full ranges (wdth 75-125, wght 300-700) so
         the width stays adjustable from CSS — see --font-width in styles.css.
         Axis names must be listed alphabetically, hence wdth before wght. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&display=swap"
      rel="stylesheet"
    />
    <!-- Declared oldest-format-first: browsers take the last one they can
         decode, so WebP-capable tabs get the 3 KB file and Safari falls back
         to the .ico. apple-touch-icon has to be PNG — iOS takes nothing else,
         and it applies its own rounding, so the file is a plain square. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.webp" type="image/webp" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
